version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: railsync-postgres
    restart: always
    environment:
      POSTGRES_DB: railsync_db
      POSTGRES_USER: railsync_admin
      POSTGRES_PASSWORD: SecurePassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - railsync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railsync_admin -d railsync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railsync-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - railsync-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railsync-backend
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://railsync_admin:SecurePassword123!@postgres:5432/railsync_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - railsync-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railsync-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - railsync-network

volumes:
  postgres_data:
  redis_data:

networks:
  railsync-network:
    driver: bridge
